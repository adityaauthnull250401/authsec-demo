[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "authsec-github-mcp-demo"
version = "0.1.0"
description = "Identity-first AuthSec demo: protected GitHub MCP tools, agents, SPIFFE, XAA, and revocation"
readme = "implementation.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "authsec-sdk>=4.7.2,<5",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-mcp-adapters>=0.2,<1",
  "langchain-openai>=1,<2",
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-dotenv>=1,<2",
  "rich>=13.9,<15",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
authsec-demo-server = "apps.mcp_server.app:main"
demo-agent = "apps.agents.cli:main"
setup-m2m = "scripts.setup_m2m:main"
preflight = "scripts.preflight:main"
validate-share = "scripts.validate_share:main"
bootstrap = "scripts.bootstrap:main"
smoke = "scripts.smoke:main"
reset = "scripts.cleanup:main"

[tool.uv.sources]
# Development deliberately consumes the checked-out, current AuthSec SDK rather
# than a stale example copy. Remove this source after 4.7.2+ is published if the
# demo needs to install on a machine without the AuthNull workspace.
authsec-sdk = { path = "../authnull/sdk-authsec/packages/python-sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["apps", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
