name: nightly-audit
    on:
      schedule: [{ cron: "0 2 * * *" }]
    permissions:
      contents: read
    jobs:
      audit:
        runs-on: ubuntu-latest
        steps:
          - uses: anthropics/claude-code-action@v1
            env:
              ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}