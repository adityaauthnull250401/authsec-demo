# Demo-owned SPIRE Server. It is isolated from AuthSec production and from the
# deprecated single-node stack. JWT-SVIDs carry the public OIDC issuer below;
# their subjects remain under the separate SPIFFE trust domain authsec.demo.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "authsec.demo"
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    jwt_issuer = "https://spire-demo.mcpauthz.com"
    ca_ttl = "24h"
    default_x509_svid_ttl = "5m"
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}

