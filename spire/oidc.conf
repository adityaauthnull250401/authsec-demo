# OIDC Discovery exposes SPIRE's JWT signing keys to AuthSec. Cloudflare
# terminates TLS; this process is bound only to localhost through Compose.
log_level = "info"
domains = ["spire-demo.mcpauthz.com", "spire-oidc"]
insecure_addr = ":8443"

server_api {
    address = "unix:///tmp/spire-server/private/api.sock"
}

