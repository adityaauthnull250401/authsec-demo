# The local agent is node-attested with a one-time join token generated by
# scripts/spire-up.sh. Workloads are attested from Unix peer credentials on the
# shared Workload API socket. The release-reporter joins only the Agent's PID
# namespace so the Unix attestor can resolve its peer process; it runs as uid 0
# and is registered with selector unix:uid:0.
agent {
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "authsec.demo"
    # Generated from this demo's Server before the Agent starts. This keeps
    # bootstrap authenticated without weakening the Agent with
    # insecure_bootstrap=true.
    trust_bundle_path = "/opt/spire/conf/agent/bootstrap-bundle.pem"
}

plugins {
    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
